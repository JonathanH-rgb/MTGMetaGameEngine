services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: mtg-postgres
    environment:
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: mtg
      POSTGRES_DB: metagame
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg -d metagame"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/metagame
      SPRING_DATASOURCE_USERNAME: mtg
      SPRING_DATASOURCE_PASSWORD: mtg
    ports:
      - "8080:8080"

volumes:
  pgdata:
